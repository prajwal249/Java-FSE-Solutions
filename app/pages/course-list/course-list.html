<div class="course-container">
  <h1>Available Courses</h1>
  <p *ngIf="isLoading; else courseContent">Loading courses...</p>
  <ng-template #courseContent>
    <div *ngIf="courses.length > 0; else noCourses">
      <app-course-card
        *ngFor="let course of courses; trackBy: trackByCourseId"
        [course]="course"
        (enroll)="onCourseEnroll($event)">
      </app-course-card>
    </div>
    <ng-template #noCourses>
      <p>No courses available.</p>
    </ng-template>
  </ng-template>
  <p>Selected course ID: {{ selectedCourseId }}</p>
</div>
