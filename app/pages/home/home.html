<div class="home-container">
  <h1>{{ portalName }}</h1>
  <p>Welcome to the Student Course Portal.</p>
  <div class="stats-row">
    <div>Courses Available: {{ courseCount }}</div>
    <div>Enrolled: 3</div>
    <div>GPA: 3.8</div>
  </div>

  <button [disabled]="isPortalActive">Enroll Now</button>
  <button (click)="onEnrollClick()">Open Enrollment</button>
  <p>{{ message }}</p>

  <input type="text" [(ngModel)]="searchTerm" placeholder="Search course">
  <p>Searching for: {{ searchTerm }}</p>
</div>
